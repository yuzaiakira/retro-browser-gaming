name: Retro browser gaming verification
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_USER: retro
          POSTGRES_DB: retro
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U retro" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m venv .venv
      - run: .venv/bin/pip install --require-hashes -r apps/api/requirements-dev.lock
      - run: bash scripts/test-backend.sh
        env:
          TEST_DATABASE_URL: postgresql://retro:ci-only@localhost:5432/retro
      - run: .venv/bin/python scripts/check-migrations.py
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci && npm run generate && npm run typecheck && git diff --exit-code
        working-directory: packages/contracts
  frontend-quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm ci
        working-directory: apps/web
      - run: npm test && npm run lint && npm run typecheck && npm run build
        working-directory: apps/web
      # Public CI is SOURCE_ONLY: private .data/.wasm cores are not in Git.
      - run: python3 scripts/verify-core-lock.py --mode SOURCE_ONLY
      - run: python3 scripts/check-no-private-cores-tracked.py
      - run: python3 scripts/test_private_asset_backup.py
      - run: python3 scripts/test_browser_allowlist.py
      - run: python3 scripts/test_sync_fail_closed.py
      - run: python3 scripts/check-source-offer-gate.py
  browser-html5:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: python -m venv .venv && .venv/bin/pip install --require-hashes -r apps/api/requirements-dev.lock
      - run: npm ci && npm run build && npx playwright install --with-deps chromium
        working-directory: apps/web
      # HTML5 Orbit path does not need private WASM cores.
      - run: ./scripts/browser-smoke.sh
      - run: python3 scripts/verify-core-lock.py --mode SOURCE_ONLY
# WASM core smokes (Genesis/PS1/PSP/…) require authorized private assets locally:
#   python3 scripts/private-asset-backup.py import --backup <dir>
#   python3 scripts/provision-private-cores.py
#   python3 scripts/verify-core-lock.py --mode LOCAL_FULL
# This workflow is supplied for public source CI. It is not a complete PDR release gate.
