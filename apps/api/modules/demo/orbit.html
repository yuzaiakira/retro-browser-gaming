<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>Orbit Catch</title><style>html,body{margin:0;background:#10131d;color:#fff;font:16px system-ui;text-align:center}canvas{width:min(100vw,640px);height:auto;touch-action:none;background:#20263a}button{padding:14px;margin:8px;background:#9885f8;border:0;border-radius:6px;font:inherit}button:focus-visible{outline:3px solid #4edcb0}</style><h1>Orbit Catch</h1><p id="status" aria-live="polite">Catch mint stars. Avoid amber comets.</p><canvas width="640" height="480" aria-label="Game field"></canvas><div><button id="start">Start / restart</button><button id="pause">Pause / resume</button></div><p>Move with ← → or A / D, or drag across the field.</p><script>
'use strict';const c=document.querySelector('canvas'),ctx=c.getContext('2d'),label=document.querySelector('#status');let x=320,score=0,lives=3,items=[],running=false,paused=false,last=0,spawn=0,keys=new Set();
function restart(){x=320;score=0;lives=3;items=[];spawn=0;running=true;paused=false;label.textContent='Score 0 · Lives 3'}
document.querySelector('#start').onclick=restart;document.querySelector('#pause').onclick=()=>{if(running){paused=!paused;label.textContent=paused?'Paused':`Score ${score} · Lives ${lives}`}};
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','a','d'].includes(e.key)){e.preventDefault();keys.add(e.key)}});addEventListener('keyup',e=>keys.delete(e.key));addEventListener('blur',()=>{keys.clear();if(running)paused=true});document.addEventListener('visibilitychange',()=>{if(document.hidden){keys.clear();paused=true}});
function pointer(e){const b=c.getBoundingClientRect();x=Math.max(18,Math.min(622,(e.clientX-b.left)*640/b.width))}c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);pointer(e)};c.onpointermove=e=>{if(e.buttons)pointer(e)};
function frame(t){const dt=Math.min((t-last)/1000,.04);last=t;if(running&&!paused){x=Math.max(18,Math.min(622,x+((keys.has('ArrowRight')||keys.has('d')?1:0)-(keys.has('ArrowLeft')||keys.has('a')?1:0))*360*dt));spawn+=dt;if(spawn>.55){spawn=0;items.push({x:20+Math.random()*600,y:-10,bad:Math.random()<.25})}for(const o of items){o.y+=(140+score*3)*dt;if(o.y>420&&o.y<455&&Math.abs(o.x-x)<28){if(o.bad)lives--;else score++;o.y=500;label.textContent=`Score ${score} · Lives ${lives}`}}items=items.filter(o=>o.y<500);if(lives<=0){running=false;label.textContent=`Game over · Score ${score}`}}ctx.fillStyle='#20263a';ctx.fillRect(0,0,640,480);ctx.fillStyle='#9885f8';ctx.fillRect(x-18,435,36,14);for(const o of items){ctx.fillStyle=o.bad?'#f6c66b':'#4edcb0';ctx.beginPath();ctx.arc(o.x,o.y,8,0,Math.PI*2);ctx.fill()}requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script><script>
// Retro HTML5 runtime protocol v1. This source is first-party and isolated in an opaque-origin frame.
const send=(value)=>parent.postMessage({...value,session:window.RETRO_SESSION},'*');
addEventListener('message',event=>{if(event.source!==parent||event.data?.session!==window.RETRO_SESSION)return;const d=event.data;if(d.type==='input'){const key=d.command===6?'ArrowLeft':d.command===7?'ArrowRight':null;if(key){if(d.value)keys.add(key);else keys.delete(key);}if(d.command===3&&d.value)restart();return;}if(d.type!=='command')return;try{let value=null;switch(d.method){case'start':restart();break;case'pause':paused=true;break;case'resume':paused=false;break;case'reset':restart();break;case'save':value=new TextEncoder().encode(JSON.stringify({v:1,x,score,lives,items,spawn,running}));break;case'load':{const state=JSON.parse(new TextDecoder().decode(new Uint8Array(d.value)));if(state.v!==1||!Number.isFinite(state.x)||!Number.isInteger(state.score)||!Number.isInteger(state.lives)||!Array.isArray(state.items)||state.items.length>100||state.items.some(o=>!Number.isFinite(o.x)||!Number.isFinite(o.y)||typeof o.bad!=='boolean'))throw new Error('Invalid game state');x=state.x;score=state.score;lives=state.lives;items=state.items;spawn=state.spawn;running=state.running;label.textContent=`Score ${score} · Lives ${lives}`;break;}default:throw new Error('Unsupported operation');}send({type:'reply',id:d.id,value});}catch(error){send({type:'reply',id:d.id,error:String(error)});}});
send({type:'ready',capabilities:{saveState:true,audio:false,analog:false}});
</script></html>
