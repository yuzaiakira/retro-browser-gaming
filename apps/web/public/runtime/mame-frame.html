<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Arcade runtime (MAME-derived)</title>
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; font-src 'self' data:; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"
  />
  <link rel="stylesheet" href="/runtime/frame.css" />
  <style>
    html, body, #container {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #050508;
      overflow: hidden;
    }
    #canvas {
      display: block;
      margin: 0 auto;
      max-width: 100%;
      max-height: 100%;
      background: #000;
    }
    #status {
      color: #c8c8d0;
      font: 14px/1.4 ui-monospace, monospace;
      padding: 1rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="container" aria-label="Arcade game stage">
    <div id="status" role="status">Starting arcade runtime…</div>
    <canvas id="canvas" width="160" height="120" tabindex="0"></canvas>
  </div>
  <script src="/runtime/mame-frame.js"></script>
</body>
</html>
