services:
  db:
    image: postgres:17.6-bookworm
    env_file: .env
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  object-store:
    build:
      context: .
      dockerfile: infra/docker/object-store.Dockerfile
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Run scripts/init-env.py}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Run scripts/init-env.py}
    ports: ["127.0.0.1:9000:9000"]
    volumes: ["object-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000"]
      interval: 5s
      timeout: 5s
      retries: 30
  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
      args: [HTTP_PROXY, HTTPS_PROXY, NO_PROXY]
      extra_hosts: ["proxy:${RBG_DOCKER_PROXY_IP:-127.0.0.1}"]
      secrets: [proxy_ca]
    env_file: .env
    environment:
      # SeaweedFS authenticates signed GETs but rejects unsigned CORS
      # preflights. Keep launcher transfers same-origin in local Compose.
      S3_BROWSER_PROXY: "true"
    depends_on:
      db: {condition: service_healthy}
      object-store: {condition: service_healthy}
    command: ["sh", "-c", "python manage.py migrate && python manage.py init_storage && python manage.py seed_demo --safe-assets-only --with-console-fixtures && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2"]
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["api-static:/app/staticfiles"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 20
  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        API_INTERNAL_URL: http://api:8000
        # Dedicated-origin cutover is opt-in; enable after PH-06 offline gate.
        # Cutover enabled after PH-06 dedicated offline gate (2026-10-21).
        NEXT_PUBLIC_J2ME_DEDICATED_ORIGIN: ${NEXT_PUBLIC_J2ME_DEDICATED_ORIGIN:-true}
        NEXT_PUBLIC_J2ME_RUNTIME_ORIGIN: ${NEXT_PUBLIC_J2ME_RUNTIME_ORIGIN:-}
        NEXT_PUBLIC_LAUNCHER_ORIGIN: ${NEXT_PUBLIC_LAUNCHER_ORIGIN:-}
        NEXT_PUBLIC_RBG_CORE_PROVISION_MODE: ${RBG_CORE_PROVISION_MODE:-PUBLIC_BROWSER}
        HTTP_PROXY:
        HTTPS_PROXY:
        NO_PROXY:
      extra_hosts: ["proxy:${RBG_DOCKER_PROXY_IP:-127.0.0.1}"]
      secrets: [proxy_ca]
    environment:
      API_INTERNAL_URL: http://api:8000
      NODE_ENV: production
      RBG_PRIVATE_ASSET_DIR: /private-runtime
      # Safe default: PUBLIC_BROWSER (allowlist only). Opt into LOCAL_FULL via
      # compose.override.yaml / .env for loopback authorized development.
      RBG_CORE_PROVISION_MODE: ${RBG_CORE_PROVISION_MODE:-PUBLIC_BROWSER}
      NEXT_PUBLIC_RBG_CORE_PROVISION_MODE: ${RBG_CORE_PROVISION_MODE:-PUBLIC_BROWSER}
      J2ME_RUNTIME_HOST: j2me.localhost
      LAUNCHER_HOST: launcher.localhost
      LAUNCHER_FRAME_ANCESTORS: ${LAUNCHER_FRAME_ANCESTORS:-http://launcher.localhost:13000 http://launcher.localhost:3000 https://launcher.localhost:13443 https://launcher.localhost:3443 http://localhost:13000 http://localhost:3000 https://localhost:13443}
      NEXT_PUBLIC_J2ME_DEDICATED_ORIGIN: ${NEXT_PUBLIC_J2ME_DEDICATED_ORIGIN:-true}
      NEXT_PUBLIC_J2ME_RUNTIME_ORIGIN: ${NEXT_PUBLIC_J2ME_RUNTIME_ORIGIN:-}
      NEXT_PUBLIC_LAUNCHER_ORIGIN: ${NEXT_PUBLIC_LAUNCHER_ORIGIN:-}
    volumes:
      # Authorized emulator .data/.wasm payloads (not tracked by Git). Read-only.
      - ${RBG_PRIVATE_ASSET_DIR:-.private-runtime}:/private-runtime:ro
    depends_on:
      api: {condition: service_healthy}
    # Published only on the docker network; browsers enter via `edge`.
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r => { if (!r.ok) process.exit(1) })"]
      interval: 10s
      timeout: 6s
      retries: 20
  edge:
    image: nginx:1.28.0-alpine
    depends_on:
      web: {condition: service_healthy}
    # 3000 = default; 13000 = local remap used by existing evidence scripts.
    ports:
      - "127.0.0.1:3000:80"
      - "127.0.0.1:13000:80"
    volumes:
      - ./infra/reverse-proxy/edge.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "--header=Host: launcher.localhost",
          "http://127.0.0.1/",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
  admin-static:
    image: nginx:1.28.0-alpine
    profiles: ["admin"]
    volumes:
      - api-static:/usr/share/nginx/html/static:ro
      - ./infra/reverse-proxy/local.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [api]
volumes:
  postgres-data:
  object-data:
  api-static:

secrets:
  # Optional TLS-inspecting proxy CA. Must be a regular file — BuildKit refuses
  # character devices such as /dev/null unless --allow=fs.read=/dev/null is set.
  # Default is an empty placeholder; Dockerfiles treat empty/missing as no-op
  # (secret mount required=false). Never bake credentials into image layers.
  proxy_ca:
    file: ${CODEX_PROXY_CERT:-./infra/docker/empty-proxy-ca.pem}
