# Host-based edge: one published port, two browser origins.
# launcher.localhost → Next launcher (API rewrites, shell SW)
# j2me.localhost     → same Next process with Host-scoped middleware (runtime only)
#
# Cookie isolation is by hostname (not port). Do not share a parent-domain cookie scope.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream retro_web {
  server web:3000;
}

server {
  listen 80;
  server_name launcher.localhost localhost 127.0.0.1;
  client_max_body_size 32m;

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_pass http://retro_web;
  }
}

server {
  listen 80;
  server_name j2me.localhost;
  client_max_body_size 8m;

  # Runtime-only origin. Middleware enforces path allowlist + CORP/CSP.
  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass http://retro_web;
  }
}

# Reject unknown hosts — do not fall through to launcher.
server {
  listen 80 default_server;
  server_name _;
  return 421;
}
